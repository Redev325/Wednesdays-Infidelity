name: Build Wednesday's Infidelity (HTML5)

on:
  push:
    branches:
      - html5-gnmath
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-html5:
    name: Compile HTML5 game
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5

      - name: Set up Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          yes | haxelib setup "$HOME/haxelib"

      - name: Install engine dependencies
        run: |
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.2.2
          haxelib install flixel-addons 3.0.2
          haxelib install flixel-ui 2.5.0
          haxelib install hscript 2.5.0
          haxelib install hxp
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate
          yes | haxelib set flxanimate 1.2.0
          haxelib list

      - name: Compile HTML5 release
        run: haxelib run lime build html5 -release

      - name: Upload HTML5 build
        uses: actions/upload-artifact@v4
        with:
          name: wednesdays-infidelity-html5
          path: export/release/html5
          if-no-files-found: error
          retention-days: 14
