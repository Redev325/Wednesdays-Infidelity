name: Build Wednesday's Infidelity (HTML5)

on:
  push:
    branches:
      - html5-gnmath
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: html5-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-html5:
    name: Compile HTML5 game
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5

      - name: Set up Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          yes | haxelib setup "$HOME/haxelib"

      - name: Install engine dependencies
        run: |
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.2.2
          haxelib install flixel-addons 3.0.2
          haxelib install flixel-ui 2.5.0
          haxelib install hscript 2.5.0
          haxelib install hxp
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate
          yes | haxelib set flxanimate 1.2.0
          haxelib list

      - name: Compile HTML5 release
        run: haxelib run lime build html5 -release

      - name: Locate HTML5 site and preserve custom domain
        id: site
        shell: bash
        run: |
          set -euo pipefail
          index_file="$(find export/release/html5 -type f -name index.html -print -quit)"
          if [ -z "$index_file" ]; then
            echo "Could not find index.html under export/release/html5."
            find export/release/html5 -maxdepth 4 -type f | head -100
            exit 1
          fi

          site_dir="$(dirname "$index_file")"
          if [ -s CNAME ]; then
            cp CNAME "$site_dir/CNAME"
          fi

          echo "path=$site_dir" >> "$GITHUB_OUTPUT"
          echo "Detected web root: $site_dir"
          du -sh "$site_dir"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload HTML5 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wednesdays-infidelity-html5
          path: export/release/html5
          if-no-files-found: error
          retention-days: 14

      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.path }}
          retention-days: 1

  deploy-pages:
    name: Publish HTML5 game
    needs: build-html5
    runs-on: ubuntu-latest
    environment:
      name: github-pages-html5-gnmath
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
